name: Save comment
description: Add new comment or update existing one

inputs:
  text:
    description: Text to place in comment
    required: true
  search_key:
    description: Key to find existing comment
    required: true
  timezone:
    description: Timzone for update timestamp
    required: false
    default: 'UTC'

runs:
  using: composite
  steps:
    - name: Get current date
      id: current-date
      shell: bash
      env:
        TIMEZONE: ${{ inputs.timezone }}
      run: echo "date=$(TZ=":$TIMEZONE" date +'%Y-%m-%d %T %z')" >> "$GITHUB_OUTPUT"
    - name: Create or update comment by "${{ inputs.search_key }}"
      uses: actions/github-script@v9
      env:
        TEXT: ${{ inputs.text }}
        SEARCH_KEY: ${{ inputs.search_key }}
        UPD_DATE: ${{ steps.current-date.outputs.date }}
      with:
        script: |
          const { TEXT, SEARCH_KEY, UPD_DATE } = process.env;
          const comments = await github.paginate(github.rest.issues.listComments, {
            ...context.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });
          const existing = comments.find(
            (c) => c.user.login === 'github-actions[bot]' && c.body.includes(SEARCH_KEY),
          );
          if (!existing) {
            const { data } = await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: TEXT,
            });
            core.info(`Created comment ${data.html_url}`);
          } else {
            const { data } = await github.rest.issues.updateComment({
              ...context.repo,
              comment_id: existing.id,
              body: `${TEXT}\nUPD: ${UPD_DATE}`,
            });
            core.info(`Updated comment ${data.html_url}`);
          }
